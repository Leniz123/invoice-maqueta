<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03080E">
<meta name="color-scheme" content="only light">
<meta name="description" content="Maqueta de la app de InVoice, con datos de ejemplo.">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="InVoice">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>InVoice App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Diseño único de marca (mixto): bloque oscuro arriba, cuerpo claro abajo, un solo acento menta. */
:root {
  --noche: #03080E;      /* bloque oscuro de marca */
  --noche-2: #0C1414;    /* superficie sobre lo oscuro */
  --tinta-clara: #E9F0F1;
  --tinta-tenue: #748386;
  --papel: #F6F8F9;      /* cuerpo claro */
  --blanco: #FFFFFF;
  --borde: #E2E8F0;
  --tinta: #03080E;
  --gris: #64748B;
  --menta: #16D3AB;
  --menta-osc: #0B8F73;
  --wsp: #25D366;
  --ambar-f: #FEF3C7; --ambar-t: #92400E; --ambar: #FBBF24;
  --azul-f: #E0F2FE;  --azul-t: #075985;
  --verde-f: #DCFCE7; --verde-t: #166534;
  --rojo: #EF4444;    --rojo-f: #FEE2E2; --rojo-t: #991B1B;
  --mesa: #DDE4E5;    /* fondo detrás del marco en computador */
  --marco: #0D1117;
  --f: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --tabs: 62px;
  /* Un solo diseño: que el navegador no lo oscurezca por su cuenta en modo oscuro */
  color-scheme: only light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--mesa); color: var(--tinta); font-family: var(--f); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--menta); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Marco: celular dibujado en computador, pantalla completa en el teléfono */
.marco { min-height: 100%; display: flex; align-items: center; justify-content: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tel { position: relative; width: 390px; height: min(844px, calc(100vh - 48px)); min-height: 620px; background: var(--papel); border: 10px solid var(--marco); border-radius: 46px; overflow: hidden; box-shadow: 0 30px 60px rgba(3, 8, 14, .28); }
@media (max-width: 520px) {
  body { background: var(--papel); }
  .marco { padding: 0; min-height: 100%; height: 100%; display: block; }
  .tel { width: 100%; height: 100%; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
}
.vista { position: absolute; inset: 0 0 var(--tabs) 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.vista.sin-tabs { bottom: 0; }

/* Pestañas */
.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: var(--tabs); display: flex; background: var(--blanco); border-top: 1px solid var(--borde); }
.tabs[hidden] { display: none !important; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; color: var(--gris); }
.tab svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--tinta); font-weight: 600; }
.tab.on svg { stroke: var(--menta-osc); }

/* Bloque oscuro superior */
.cab { background: var(--noche); color: var(--tinta-clara); padding: 22px 20px 20px; border-radius: 0 0 26px 26px; }
.cab .volver { font-size: 13px; color: var(--tinta-tenue); display: inline-flex; gap: 6px; align-items: center; padding: 4px 0; }
.cab h1 { margin: 10px 0 0; font-size: 20px; font-weight: 700; letter-spacing: -.2px; text-wrap: balance; }
.cab .sub { font-size: 12.5px; color: var(--tinta-tenue); margin-top: 3px; }
.marca { font-weight: 700; font-size: 17px; letter-spacing: -.2px; }
.marca b { color: var(--menta); font-weight: 700; }
.etq { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--gris); font-weight: 600; }
.cab .etq { color: var(--tinta-tenue); }
.grande { font-size: 32px; font-weight: 700; letter-spacing: -.6px; }
.fila { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--noche-2); color: var(--menta); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

/* Cuerpo claro */
.cuerpo { padding: 14px 18px 18px; }
.lista { display: flex; flex-direction: column; }
.item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--borde); text-align: left; width: 100%; }
.item .t { font-size: 14px; font-weight: 600; }
.item .s { font-size: 12px; color: var(--gris); margin-top: 2px; }
.item .m { text-align: right; font-size: 14px; font-weight: 600; white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.item:active { background: rgba(3, 8, 14, .03); }
.min-0 { min-width: 0; }
.pill { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 8px; letter-spacing: .01em; }
.p-cobrar { background: var(--ambar-f); color: var(--ambar-t); }
.p-vigente { background: var(--azul-f); color: var(--azul-t); }
.p-pagada { background: var(--verde-f); color: var(--verde-t); }
.p-vencida { background: var(--rojo-f); color: var(--rojo-t); }
.p-nota { background: #F1F5F9; color: #334155; }
.caja { background: var(--blanco); border: 1px solid var(--borde); border-radius: 14px; padding: 13px 14px; }
.pila { display: flex; flex-direction: column; gap: 10px; }
.ln { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 3px 0; }
.ln.tenue { color: var(--gris); }
.ln.total { font-weight: 700; font-size: 15px; border-top: 1px solid var(--borde); margin-top: 4px; padding-top: 8px; }
.link { color: var(--menta-osc); font-weight: 600; font-size: 12.5px; }
.vacio { text-align: center; color: var(--gris); font-size: 13.5px; padding: 36px 10px; }
.pie { text-align: center; font-size: 10.5px; color: #94A3B8; padding: 18px 0 8px; letter-spacing: .02em; }

/* Botones */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border-radius: 14px; padding: 14px; font-size: 15px; font-weight: 700; }
.btn-menta { background: var(--menta); color: var(--noche); }
.btn-wsp { background: var(--wsp); color: #fff; }
.btn-claro { background: var(--blanco); border: 1px solid var(--borde); color: var(--tinta); font-weight: 600; }
.btn-tenue { background: var(--tinta-clara); color: var(--noche); }
.btn:disabled { background: var(--borde); color: #94A3B8; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }
.acciones { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.accion { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: #334155; text-align: center; }
.accion .ic { width: 44px; height: 44px; border-radius: 50%; background: var(--blanco); border: 1px solid var(--borde); display: flex; align-items: center; justify-content: center; }
.accion .ic svg { width: 19px; height: 19px; stroke: var(--tinta); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.accion.wsp .ic { background: var(--wsp); border-color: var(--wsp); }
.accion.wsp .ic svg { stroke: #fff; }

/* Inicio */
.inicio-cab { padding-bottom: 84px; }
.mic { width: 124px; height: 124px; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #6FF5D8 0%, var(--menta) 52%, #0FB592 100%); display: flex; align-items: center; justify-content: center; border: 6px solid var(--papel); margin: -66px auto 0; position: relative; z-index: 1; box-shadow: 0 0 0 9px rgba(22, 211, 171, .22), 0 14px 34px rgba(22, 211, 171, .55); }
.mic::before, .mic::after { content: ''; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid var(--menta); animation: halo 2.4s ease-out infinite; pointer-events: none; }
.mic::after { animation-delay: 1.2s; }
@keyframes halo { from { transform: scale(1); opacity: .75; } to { transform: scale(1.55); opacity: 0; } }
.mic svg { width: 48px; height: 48px; fill: var(--noche); }
.mic:active { transform: scale(.96); }
.mic-txt { text-align: center; font-size: 18px; font-weight: 700; margin-top: 14px; letter-spacing: -.2px; }
.mic-sub { text-align: center; font-size: 12.5px; color: var(--gris); margin-top: 3px; }
.escribir { display: flex; align-items: center; gap: 7px; margin: 12px auto 0; border: 1px solid #CBD5E1; background: var(--blanco); border-radius: 22px; padding: 8px 15px; font-size: 13px; font-weight: 600; color: #334155; }
.escribir svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.texto-venta { width: 100%; min-height: 150px; border: 1px solid var(--borde); border-radius: 14px; background: var(--blanco); padding: 13px 14px; font: inherit; font-size: 16px; line-height: 1.5; color: var(--tinta); resize: vertical; }
.ejemplo { text-align: left; border: 1px dashed #CBD5E1; background: var(--blanco); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: #334155; }

/* Análisis */
.lectura { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.lectura b { font-size: 18px; }
.grafico { width: 100%; height: auto; display: block; }
.grafico .rejilla { stroke: var(--borde); stroke-width: 1; }
.grafico .eje { fill: var(--gris); font-size: 10px; font-family: var(--f); }
.grafico .zona { fill: transparent; cursor: pointer; }
.grafico .zona:hover + .barra { opacity: .8; }
.variacion { font-size: 12.5px; font-weight: 600; }
.sube { color: var(--verde-t); } .baja { color: var(--rojo-t); }
.cli { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 9px 0; border-bottom: 1px solid var(--borde); font-size: 13.5px; }
.cli .riel { grid-column: 1 / -1; height: 6px; background: #EEF2F4; border-radius: 3px; overflow: hidden; }
.cli .riel i { display: block; height: 100%; background: var(--menta); border-radius: 3px; }
.alerta { background: var(--ambar-f); color: var(--ambar-t); border-radius: 12px; padding: 11px 13px; font-size: 13px; line-height: 1.45; display: flex; gap: 9px; }
.alerta b { color: #78350F; }
.nota-f29 { font-size: 12px; color: var(--gris); line-height: 1.45; margin-top: 8px; }
details.tabla summary { font-size: 12.5px; color: var(--menta-osc); font-weight: 600; cursor: pointer; margin-top: 8px; }
details.tabla table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
details.tabla td { padding: 5px 0; border-bottom: 1px solid var(--borde); }
details.tabla td:last-child { text-align: right; }
.franja { position: sticky; top: 0; z-index: 3; height: 0; }
.franja > div { background: var(--noche); color: var(--tinta-clara); padding: 12px 18px; border-radius: 0 0 20px 20px; display: flex; justify-content: space-between; align-items: center; transform: translateY(-110%); transition: transform .22s ease; }
.vista.compacta .franja > div { transform: translateY(0); }
.mic-chico { width: 44px; height: 44px; border-radius: 50%; background: var(--menta); display: flex; align-items: center; justify-content: center; }
.mic-chico svg { width: 20px; height: 20px; fill: var(--noche); }

/* Buscador y filtros */
.buscar { margin-top: 14px; display: flex; align-items: center; gap: 8px; background: var(--noche-2); border-radius: 12px; padding: 0 12px; }
.buscar svg { width: 16px; height: 16px; stroke: var(--tinta-tenue); fill: none; stroke-width: 2; flex: none; }
.buscar input { flex: 1; min-width: 0; background: none; border: 0; color: var(--tinta-clara); font: inherit; font-size: 14px; padding: 11px 0; }
.buscar input::placeholder { color: var(--tinta-tenue); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 14px 18px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font-size: 12.5px; border-radius: 16px; padding: 7px 12px; border: 1px solid #CBD5E1; background: var(--blanco); }
.chip.on { background: var(--noche); color: var(--tinta-clara); border-color: var(--noche); }
.grupo { margin-top: 14px; }

/* Dictado */
.dictado { min-height: 100%; background: var(--noche); color: var(--tinta-clara); display: flex; flex-direction: column; padding: 22px 20px 24px; }
.onda { display: flex; align-items: center; justify-content: center; gap: 4px; height: 44px; margin-top: 36px; }
.onda i { width: 4px; border-radius: 2px; background: var(--menta); animation: latido 1s ease-in-out infinite; }
@keyframes latido { 0%, 100% { height: 8px; } 50% { height: 38px; } }
.mic-vivo { width: 120px; height: 120px; border-radius: 50%; background: var(--menta); display: flex; align-items: center; justify-content: center; margin: 54px auto 0; box-shadow: 0 0 0 14px rgba(22, 211, 171, .16), 0 0 0 30px rgba(22, 211, 171, .07); }
.mic-vivo svg { width: 44px; height: 44px; fill: var(--noche); }
.transcrito { font-size: 18px; line-height: 1.5; margin-top: 30px; min-height: 110px; }
.transcrito .cursor { display: inline-block; width: 2px; height: 1.1em; background: var(--menta); vertical-align: -3px; margin-left: 2px; animation: parpadeo 1s steps(2) infinite; }
@keyframes parpadeo { 50% { opacity: 0; } }
.duda { background: #FFFBEB; border: 1px solid #FCD34D; border-radius: 14px; padding: 13px 14px; font-size: 14px; }
.duda b { display: block; margin-bottom: 10px; }
.opciones { display: flex; gap: 8px; flex-wrap: wrap; }
.opciones button { border: 1px solid #CBD5E1; background: var(--blanco); border-radius: 20px; padding: 8px 13px; font-size: 13px; font-weight: 600; }
.atenuado { opacity: .45; }
.hecho { width: 64px; height: 64px; border-radius: 50%; background: var(--menta); display: flex; align-items: center; justify-content: center; margin: 6px auto 0; }
.hecho svg { width: 32px; height: 32px; stroke: var(--noche); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

/* Vista del PDF (como la plantilla aprobada el 12/10) */
.hoja { background: #fff; border: 1px solid var(--borde); border-radius: 8px; padding: 16px 15px; font-size: 9.5px; color: #111827; box-shadow: 0 4px 14px rgba(3, 8, 14, .08); }
.hoja .sup { display: flex; justify-content: space-between; gap: 10px; }
.hoja .emisor b { font-size: 11.5px; display: block; }
.hoja .sii { border: 1.5px solid #111; padding: 6px 8px; text-align: center; font-weight: 700; font-size: 9px; line-height: 1.5; flex: none; }
.hoja .sii span { color: #B91C1C; }
.hoja .rot { font-size: 7.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--gris); margin-top: 12px; }
.hoja table { width: 100%; border-collapse: collapse; margin-top: 10px; }
.hoja th { background: var(--noche); color: #fff; text-align: left; font-weight: 600; padding: 4px 6px; font-size: 8.5px; }
.hoja td { padding: 5px 6px; border-bottom: 1px solid var(--borde); }
.hoja .der { text-align: right; }
.hoja .tot { margin-left: auto; width: 55%; margin-top: 8px; }
.hoja .tot div { display: flex; justify-content: space-between; padding: 2px 0; }
.hoja .tot .fin { font-weight: 700; color: var(--menta-osc); font-size: 11px; border-top: 1px solid #111; padding-top: 4px; }
.hoja .timbre { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
.hoja .timbre i { width: 120px; height: 38px; background: repeating-linear-gradient(90deg, #111 0 2px, #fff 2px 3px, #111 3px 4px, #fff 4px 6px); flex: none; }
.hoja .timbre small { font-size: 7.5px; color: var(--gris); line-height: 1.4; }
.hoja .hecho-con { margin-top: 12px; text-align: center; font-size: 7.5px; color: var(--gris); }
.hoja .hecho-con b { color: var(--menta-osc); }

/* Ficha y cobranza */
.datos { font-size: 13px; color: #334155; display: flex; flex-direction: column; gap: 5px; }
.deuda { border-left: 4px solid #CBD5E1; }
.deuda.vencida { border-left-color: var(--rojo); }
.deuda .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.deuda .botones button { border-radius: 10px; padding: 9px; font-size: 12.5px; font-weight: 700; }
.b-wsp { background: var(--wsp); color: #fff; }
.b-gris { background: #F1F5F9; color: #334155; }
.punto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.chat { background: #ECE5DD; border-radius: 14px; padding: 14px 12px; }
.chat textarea { width: 100%; min-height: 168px; border: 0; border-radius: 12px 12px 3px 12px; background: #DCF8C6; padding: 11px 12px; font: inherit; font-size: 13.5px; line-height: 1.5; color: #111; resize: vertical; }
.adjunto { background: #fff; border-radius: 10px; padding: 9px 11px; margin-top: 8px; font-size: 12.5px; display: flex; gap: 8px; align-items: center; }

/* Aviso */
.toast { position: absolute; left: 16px; right: 16px; bottom: calc(var(--tabs) + 14px); background: var(--noche); color: var(--tinta-clara); border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.4; box-shadow: 0 10px 24px rgba(3, 8, 14, .3); z-index: 10; }
.toast b { color: var(--menta); }

@media (prefers-reduced-motion: reduce) {
  .mic::before, .mic::after { animation: none; opacity: 0; }
  .onda i, .transcrito .cursor { animation: none; height: 20px; }
  .franja > div { transition: none; }
}
</style>

</head>
<body>
<div class="marco">
  <div class="tel" id="tel">
    <div class="vista" id="vista"></div>
    <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
    <div class="toast" id="toast" role="status" hidden></div>
  </div>
</div>

<script src="logica.js"></script>
<script>

    inicio: '<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
    documentos: '<svg viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M8.5 13h7M8.5 17h5"/></svg>',

    analisis: '<svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V5M16 20v-7M21 20H3"/></svg>',
    lapiz: '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
    buscar: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',

    pdf: '<svg viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/></svg>',

    nota: '<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4.5h4.5"/></svg>',
    convertir: '<svg viewBox="0 0 24 24"><path d="M4 7h13l-3.5-3.5M20 17H7l3.5 3.5"/></svg>',
    flecha: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  };

  const estado = {
    datos: L.ejemplo(),
    pantalla: 'inicio', params: {},
    filtro: 'todos', busqueda: '', busquedaCli: '',
    dictado: null, frasesUsadas: 0, borrador: '',

  const vista = document.getElementById('vista');
  const tabs = document.getElementById('tabs');
  const toast = document.getElementById('toast');
  const HOY = estado.datos.hoy;

  // ── utilidades ──────────────────────────────────────────────────────────
  const $ = L.formatoCLP;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function fechaCorta(f) {
    const d = Math.round((Date.UTC(HOY.getFullYear(), HOY.getMonth(), HOY.getDate()) - Date.UTC(f.getFullYear(), f.getMonth(), f.getDate())) / 86400000);
    if (d === 0) return 'hoy';
    if (d === 1) return 'ayer';
    return f.getDate() + ' ' + MES_C[f.getMonth()];
  }
  const fechaLarga = f => f.getDate() + ' de ' + MESES[f.getMonth()] + ' de ' + f.getFullYear();
  const NOMBRE = { factura: 'Factura', cotizacion: 'Cotización', nota: 'Nota de crédito' };
  const titulo = d => NOMBRE[d.tipo] + ' ' + d.numero;
  function estadoDoc(d) {
    if (d.tipo === 'cotizacion') return d.convertida ? ['Facturada', 'p-nota'] : ['Vigente', 'p-vigente'];
    if (d.tipo === 'nota') return ['Nota de crédito', 'p-nota'];
    if (d.pagada) return ['Pagada', 'p-pagada'];
    const c = L.resumenCobranza([d], HOY).deudas[0];
    return c.vencido ? ['Vencida', 'p-vencida'] : ['Por cobrar', 'p-cobrar'];
  }
  const montoDoc = d => d.tipo === 'nota' ? -d.total : d.total;
  const iniciales = n => n.split(' ').filter(p => /^[A-ZÁÉÍÓÚÑ]/.test(p)).slice(0, 2).map(p => p[0]).join('');
  const deudaCliente = id => L.resumenCobranza(estado.datos.documentos.filter(d => d.cliente.id === id), HOY).total;
  const pie = '<div class="pie">Maqueta · datos de ejemplo</div>';
  let temporizadorToast;
  function aviso(html) {
    toast.innerHTML = html;
    toast.hidden = false;
    clearTimeout(temporizadorToast);
    temporizadorToast = setTimeout(() => { toast.hidden = true; }, 3200);
  }
  const enLaReal = txt => aviso('<b>En la versión real:</b> ' + txt);
  // Abre el menú de compartir del celular cuando el navegador lo permite (no dentro de claude.ai).
  function compartir(texto, siNoSePuede) {
    if (!navigator.share) return enLaReal(siNoSePuede);
    navigator.share({ title: 'InVoice', text: texto }).catch(err => {
      if (!err || err.name !== 'AbortError') enLaReal(siNoSePuede);
    });
  }

  function itemDoc(d) {
    const [txt, cls] = estadoDoc(d);
    return '<button class="item" data-ir="documento" data-id="' + d.id + '">' +

      '<span class="m num">' + $(montoDoc(d)) + '<span class="pill ' + cls + '">' + txt + '</span></span></button>';
  }
  const ordenados = docs => docs.slice().sort((a, b) => b.fecha - a.fecha || (b.tipo === 'factura') - (a.tipo === 'factura') || b.numero - a.numero);

      '<header class="cab inicio-cab"><div class="fila"><span class="marca">In<b>Voice</b></span><span class="avatar">' + iniciales(estado.datos.empresa.nombre) + '</span></div>' +
      '<div class="sub" style="margin-top:20px">Hola, ' + esc(estado.datos.empresa.usuario) + '</div>' +
      '<div class="etq" style="margin-top:14px">Facturado en ' + MESES[HOY.getMonth()] + '</div>' +
      '<div class="grande num">' + $(mes.facturado) + '</div>' +
      '<div class="sub num">' + mes.cantidad + ' documentos · <span style="color:var(--menta)">te deben ' + $(deben) + '</span></div></header>' +
      '<button class="mic" data-accion="dictar" aria-label="Dictar una factura">' + ICONO.mic + '</button>' +

  function pDocumentos() {

      '<div class="fila" style="margin-top:16px;align-items:flex-end"><div><div class="etq">Facturado en ' + HOY.getFullYear() + '</div><div class="num" style="font-size:20px;font-weight:700">' + $(facturado) + '</div></div>' +
      '<div style="text-align:right"><div class="etq">Te debe</div><div class="num" style="font-size:20px;font-weight:700;color:' + (debe ? 'var(--ambar)' : 'var(--menta)') + '">' + (debe ? $(debe) : 'Nada') + '</div></div></div></header>' +

      '<div><div class="etq" style="margin-top:6px">Documentos</div><div class="lista">' + docs.map(itemDoc).join('') + '</div></div>' + pie + '</div>';

    const tarjetas = c.deudas.map(x => {

  // ── análisis ────────────────────────────────────────────────────────────
  const pct = (n, dec) => n.toFixed(dec || 0).replace('.', ',') + ' %';
  const Mayus = s => s[0].toUpperCase() + s.slice(1);
  function etiquetaEje(v) {
    if (v === 0) return '$0';
    return v >= 1000000 ? '$' + String(v / 1000000).replace('.', ',') + ' M' : '$' + v / 1000 + ' mil';
  }

  function graficoVentas(meses, sel) {
    const W = 340, H = 190, izq = 50, abajo = 26, arriba = 10;
    const paso = 250000;
    const tope = Math.max(paso, Math.ceil(Math.max(...meses.map(m => m.total)) / paso) * paso);
    const y = v => arriba + (H - abajo - arriba) * (1 - v / tope);
    const banda = (W - izq) / meses.length, ancho = 26, base = y(0);
    let svg = '<svg class="grafico num" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Ventas de los últimos 6 meses">';
    for (let v = 0; v <= tope; v += paso) {
      svg += '<line class="rejilla" x1="' + izq + '" x2="' + W + '" y1="' + y(v) + '" y2="' + y(v) + '"/>' +
        '<text class="eje" x="' + (izq - 6) + '" y="' + (y(v) + 3.5) + '" text-anchor="end">' + etiquetaEje(v) + '</text>';
    }
    meses.forEach((m, i) => {
      const cx = izq + banda * i + banda / 2, x = cx - ancho / 2, top = y(m.total), r = Math.min(4, base - top);
      const enCurso = i === meses.length - 1;
      const color = i === sel ? 'var(--menta-osc)' : 'var(--menta)';
      svg += '<rect class="zona" data-mes="' + i + '" x="' + (izq + banda * i) + '" y="' + arriba + '" width="' + banda + '" height="' + (H - arriba) + '"/>' +
        '<path class="barra" d="M' + x + ',' + base + 'V' + (top + r) + 'Q' + x + ',' + top + ' ' + (x + r) + ',' + top + 'H' + (x + ancho - r) + 'Q' + (x + ancho) + ',' + top + ' ' + (x + ancho) + ',' + (top + r) + 'V' + base + 'Z" fill="' + color + '"' + (enCurso && i !== sel ? ' fill-opacity=".45"' : '') + ' pointer-events="none"/>' +
        '<text class="eje" x="' + cx + '" y="' + (H - 9) + '" text-anchor="middle"' + (i === sel ? ' style="fill:var(--tinta);font-weight:600"' : '') + '>' + MES_C[m.mes] + (enCurso ? '*' : '') + '</text>';
    });
    return svg + '</svg>';
  }

  function pAnalisis() {
    const docs = estado.datos.documentos, anio = HOY.getFullYear(), mes = HOY.getMonth();
    const meses = L.ventasPorMes(docs, anio, mes, 6);
    const ultimo = meses.length - 1;
    const sel = estado.mesSel == null ? ultimo - 1 : estado.mesSel;
    const m = meses[sel], previo = meses[sel - 1];
    const enCurso = sel === ultimo;
    let variacion = '';
    if (enCurso) variacion = '<span class="variacion" style="color:var(--gris)">va al día ' + HOY.getDate() + '</span>';
    else if (previo && previo.total) {
      const v = 100 * (m.total - previo.total) / previo.total;
      variacion = '<span class="variacion ' + (v >= 0 ? 'sube' : 'baja') + '">' + (v >= 0 ? '▲ +' : '▼ −') + pct(Math.abs(v), 1) + ' vs ' + MESES[previo.mes] + '</span>';
    }
    const anual = L.ventasPorMes(docs, anio, mes, mes + 1).reduce((s, x) => s + x.total, 0);
    const top = L.mejoresClientes(docs, anio, 5);
    const iva = L.ivaDelMes(docs, anio, mes);
    const alerta = top[0] && top[0].pct > 40
      ? '<div class="alerta" role="note"><span aria-hidden="true">⚠</span><span><b>Dependes mucho de ' + esc(top[0].cliente.corto) + '.</b> Es el ' + pct(top[0].pct) + ' de lo que vendiste este año; si deja de comprarte, se nota fuerte.</span></div>'
      : '';
    return '<header class="cab"><h1 style="margin-top:0">Análisis</h1>' +
      '<div class="fila" style="margin-top:14px;align-items:flex-end"><div><div class="etq">Vendido en ' + anio + '</div><div class="grande num">' + $(anual) + '</div></div>' +
      '<div style="text-align:right"><div class="etq">' + Mayus(MESES[mes]) + ' (en curso)</div><div class="num" style="font-size:18px;font-weight:700;color:var(--menta)">' + $(meses[ultimo].total) + '</div></div></div></header>' +
      '<div class="cuerpo pila">' +
      '<div class="caja"><div class="etq">Ventas por mes</div>' +
      '<div class="lectura" style="margin-top:8px"><span><span style="font-size:13px;color:var(--gris)">' + Mayus(MESES[m.mes]) + (enCurso ? ' (en curso)' : '') + '</span><br><b class="num">' + $(m.total) + '</b></span>' + variacion + '</div>' +
      graficoVentas(meses, sel) +
      '<div style="font-size:11.5px;color:var(--gris);margin-top:2px">Toca un mes para ver su detalle. * ' + MESES[mes] + ' todavía no termina.</div>' +
      '<details class="tabla"><summary>Ver como tabla</summary><table class="num">' + meses.map(x => '<tr><td>' + Mayus(MESES[x.mes]) + '</td><td>' + $(x.total) + '</td></tr>').join('') + '</table></details></div>' +
      '<div class="caja"><div class="etq">Mejores clientes de ' + anio + '</div>' +
      top.map(x => '<button class="cli" style="width:100%;text-align:left" data-ir="cliente" data-id="' + x.cliente.id + '"><span style="font-weight:600">' + esc(x.cliente.corto) + '</span><span class="num">' + $(x.total) + ' · ' + pct(x.pct) + '</span><span class="riel"><i style="width:' + x.pct.toFixed(1) + '%"></i></span></button>').join('') + '</div>' +
      alerta +
      '<div class="caja num"><div class="etq">IVA de ' + MESES[mes] + ' para el F29</div>' +
      '<div class="ln" style="margin-top:6px"><span>IVA de tus facturas</span><span>' + $(iva.ivaFacturas) + '</span></div>' +
      '<div class="ln tenue"><span>Menos IVA de notas de crédito</span><span>−' + $(iva.ivaNotas) + '</span></div>' +
      '<div class="ln total"><span>IVA de tus ventas</span><span>' + $(iva.debito) + '</span></div>' +
      '<div class="nota-f29">Es el IVA de lo que vendiste (débito fiscal). Para saber cuánto pagar en el F29, a esto se le resta el IVA de tus compras, que InVoice todavía no conoce.</div></div>' +
      pie + '</div>';
  }

  // ── escribir la venta ───────────────────────────────────────────────────
  const EJEMPLOS = [
    'Factura a Los Robles, 3 fletes a 40.000 más IVA, contado',
    'Factura a Constructora Andes por instalación eléctrica de faena, 180.000',
  ];
  function pEscribir() {
    return '<header class="cab"><button class="volver" data-accion="atras">' + ICONO.flecha + 'Volver</button><h1>Escribe tu venta</h1>' +
      '<div class="sub">Como se lo dirías a alguien: a quién, qué vendiste, cuánto y si es más IVA.</div></header>' +
      '<div class="cuerpo pila"><label class="etq" for="texto-venta">Tu venta</label>' +
      '<textarea class="texto-venta" id="texto-venta" placeholder="Ej.: Factura a Los Robles, 3 fletes a 40.000 más IVA">' + esc(estado.texto || '') + '</textarea>' +
      '<div class="etq" style="margin-top:4px">O toca un ejemplo</div>' +
      EJEMPLOS.map((t, i) => '<button class="ejemplo" data-accion="ejemplo-texto" data-i="' + i + '">«' + esc(t) + '»</button>').join('') +
      '<button class="btn btn-menta" data-accion="leer-texto">Revisar factura</button>' +
      '<div style="font-size:11.5px;color:var(--gris);text-align:center">En la maqueta la lectura es simple. En la versión real la hace la misma IA que entiende tus audios.</div>' + pie + '</div>';
  }

  // ── dictado ─────────────────────────────────────────────────────────────
  function frasesPara(clienteId) {
    const cl = id => estado.datos.clientes.find(c => c.id === id);
    if (clienteId) {
      const c = cl(clienteId);
      return { texto: 'Factura a ' + c.corto + ', dos mantenciones a sesenta mil cada una, más IVA', cliente: c, items: [{ desc: 'Mantención', cant: 2, precio: 60000 }], ivaIncluido: false, pago: c.pago };
    }
    const lista = [
      { texto: 'Factura a Los Robles, tres fletes a cuarenta mil cada uno, más IVA, al contado', cliente: cl('robles'), items: [{ desc: 'Flete Valparaíso–Santiago', cant: 3, precio: 40000 }], ivaIncluido: false, pago: 'Contado' },
      { texto: 'Factura a Constructora Andes, instalación eléctrica de faena, ciento ochenta mil', cliente: cl('andes'), items: [{ desc: 'Instalación eléctrica de faena', cant: 1, precio: 180000 }], ivaIncluido: null, pago: '30 días' },
    ];
    return lista[estado.frasesUsadas++ % lista.length];
  }

  let temporizadorDictado;
  function empezarDictado(clienteId) {
    const f = frasesPara(clienteId);
    estado.dictado = Object.assign({ paso: 1, palabras: 0, observacion: '' }, f, { items: f.items.map(i => Object.assign({}, i)) });
    ir('dictado');
    const total = f.texto.split(' ').length;
    clearInterval(temporizadorDictado);
    temporizadorDictado = setInterval(() => {
      const dd = estado.dictado;
      if (!dd || dd.paso !== 1) return clearInterval(temporizadorDictado);
      dd.palabras = Math.min(total, dd.palabras + 1);
      const el = document.getElementById('transcrito');
      if (el) el.innerHTML = '«' + esc(f.texto.split(' ').slice(0, dd.palabras).join(' ')) + (dd.palabras === total ? '»' : '') + '<span class="cursor"></span>';
      const reloj = document.getElementById('reloj');
      if (reloj) reloj.textContent = '● 0:' + String(Math.min(59, Math.ceil(dd.palabras * 0.45))).padStart(2, '0');
      if (dd.palabras === total) clearInterval(temporizadorDictado);
    }, 230);
  }

  function totalesDictado(dd) {
    const suma = dd.items.reduce((s, i) => s + i.cant * i.precio, 0);
    if (dd.ivaIncluido === null) return null;
    return dd.ivaIncluido ? L.calcularTotales(null, suma) : L.calcularTotales(suma, null);
  }

  function pDictado() {
    const dd = estado.dictado;
    if (dd.paso === 1) {
      const barras = Array.from({ length: 22 }, (_, i) => '<i style="animation-delay:' + ((i * 137) % 900) / 1000 + 's"></i>').join('');
      return '<div class="dictado"><div class="fila"><button class="volver" style="color:var(--tinta-tenue);font-size:14px" data-accion="cancelar-dictado">✕ Cancelar</button><span id="reloj" class="num" style="color:var(--menta);font-size:13px">● 0:00</span></div>' +
        '<div class="mic-vivo">' + ICONO.mic + '</div><div class="onda" aria-hidden="true">' + barras + '</div>' +
        '<div class="transcrito" id="transcrito">«' + esc(dd.texto.split(' ').slice(0, dd.palabras).join(' ')) + '<span class="cursor"></span></div>' +
        '<div style="margin-top:auto"><button class="btn btn-tenue" data-accion="listo-dictado">Listo</button>' +
        '<div class="pie" style="color:var(--tinta-tenue)">Maqueta · el dictado es simulado</div></div></div>';
    }
    if (dd.paso === 2) {
      const t = totalesDictado(dd);
      const suma = dd.items.reduce((s, i) => s + i.cant * i.precio, 0);
      const duda = dd.ivaIncluido === null
        ? '<div class="duda"><b>¿Los ' + $(suma) + ' que dictaste ya traen el IVA?</b><div class="opciones"><button data-accion="iva" data-v="no">No, súmale IVA</button><button data-accion="iva" data-v="si">Sí, ya lo traen</button></div></div>'
        : '';
      return '<header class="cab"><div class="fila"><button class="volver" data-accion="cancelar-dictado">' + ICONO.flecha + 'Volver</button>' +
        (dd.escrito ? '<button class="volver" data-accion="cancelar-dictado">Editar texto</button>' : '<button class="volver" data-accion="redictar">Dictar de nuevo</button>') + '</div>' +
        '<h1>Factura electrónica</h1><div class="grande num" style="color:var(--menta);font-size:28px">' + (t ? $(t.total) : '—') + '</div></header>' +
        '<div class="cuerpo pila">' + duda +
        '<div class="caja"><div class="fila"><span class="etq">Cliente</span><button class="link" data-accion="cambiar-cliente">Cambiar</button></div><div style="font-weight:700;margin-top:3px">' + esc(dd.cliente.nombre) + '</div><div style="font-size:12px;color:var(--gris)" class="num">RUT ' + L.formatoRut(dd.cliente.rut) + ' · ' + esc(dd.cliente.giro) + '</div></div>' +
        '<div class="caja num' + (t ? '' : ' atenuado') + '"><div class="fila" style="margin-bottom:4px"><span class="etq">Detalle</span><button class="link" data-accion="editar-detalle">Editar</button></div>' +
        dd.items.map(i => '<div class="ln"><span>' + i.cant + ' × ' + esc(i.desc) + '</span><span>' + $(i.cant * i.precio) + '</span></div>').join('') +
        '<div class="ln tenue"><span>Neto</span><span>' + (t ? $(t.neto) : '—') + '</span></div><div class="ln tenue"><span>IVA 19 %</span><span>' + (t ? $(t.iva) : '—') + '</span></div><div class="ln total"><span>Total</span><span>' + (t ? $(t.total) : '—') + '</span></div></div>' +
        '<div class="caja"><div class="ln"><span style="color:var(--gris)">Forma de pago</span><span>' + esc(dd.pago) + ' · <button class="link" data-accion="cambiar-pago">Cambiar</button></span></div>' +
        '<div class="ln"><span style="color:var(--gris)">Observación</span>' + (dd.observacion ? '<span>' + esc(dd.observacion) + '</span>' : '<button class="link" data-accion="observacion">+ Agregar</button>') + '</div></div>' +
        '<button class="btn btn-menta" data-accion="emitir"' + (t ? '' : ' disabled') + '>Emitir factura</button>' +
        (t ? '' : '<div style="text-align:center;font-size:12px;color:var(--gris)">Responde la pregunta de arriba para poder emitir</div>') + pie + '</div>';
    }
    const d = estado.datos.documentos.find(x => x.id === dd.emitida);
    return '<header class="cab" style="text-align:center;padding-top:26px"><div class="hecho">' + ICONO.check + '</div>' +
      '<h1>Factura N° ' + d.numero + ' emitida</h1><div class="sub">Aceptada por el SII · ' + esc(d.cliente.corto) + ' · ' + $(d.total) + '</div></header>' +
      '<div class="cuerpo pila">' + hojaPDF(d) +
      '<button class="btn btn-wsp" data-accion="compartir">Compartir por WhatsApp</button>' +
      '<div class="acciones" style="grid-template-columns:1fr 1fr"><button class="btn btn-claro" data-accion="descargar">Descargar</button><button class="btn btn-claro" data-accion="correo">Enviar por correo</button></div>' +
      '<button class="btn btn-claro" data-accion="fin-dictado">Listo</button>' +
      '<div class="pie">Maqueta · no se envió nada al SII</div></div>';
  }

  function emitir() {
    const dd = estado.dictado;
    const t = totalesDictado(dd);
    if (!t) return;
    const docs = estado.datos.documentos;
    const numero = Math.max(...docs.filter(d => d.tipo === 'factura').map(d => d.numero)) + 1;
    const vence = new Date(HOY.getTime() + (dd.pago === '30 días' ? 30 : 0) * 86400000);
    docs.push({ id: 'factura' + numero, tipo: 'factura', numero, cliente: dd.cliente, fecha: new Date(HOY), items: dd.items, neto: t.neto, iva: t.iva, total: t.total, pago: dd.pago, vence, pagada: false, observacion: dd.observacion });
    if (dd.desdeCotizacion) docs.find(d => d.id === dd.desdeCotizacion).convertida = true;
    dd.emitida = 'factura' + numero;
    dd.paso = 3;
    dibujar();
  }

  // ── navegación ──────────────────────────────────────────────────────────
  const historial = [];
  function ir(pantalla, params) {
    if (pantalla !== estado.pantalla || JSON.stringify(params || {}) !== JSON.stringify(estado.params)) {
      historial.push({ pantalla: estado.pantalla, params: estado.params });
    }
    estado.pantalla = pantalla;
    estado.params = params || {};
    dibujar(true);
  }
  function atras() {
    const prev = historial.pop() || { pantalla: 'inicio', params: {} };
    estado.pantalla = prev.pantalla;
    estado.params = prev.params;
    estado.borrador = '';
    dibujar(true);
  }
  function irTab(t) {
    historial.length = 0;
    estado.pantalla = t;
    estado.params = {};
    dibujar(true);
  }

  const RAIZ = { inicio: 'inicio', documentos: 'documentos', documento: 'documentos', pdf: 'documentos', clientes: 'clientes', cliente: 'clientes', cobranza: 'cobranza', recordatorio: 'cobranza', analisis: 'analisis' };
  const TABS = [['inicio', 'Inicio'], ['documentos', 'Documentos'], ['clientes', 'Clientes'], ['cobranza', 'Cobranza'], ['analisis', 'Análisis']];
  const SIN_TABS = ['dictado', 'escribir'];
  function dibujar(arriba) {
    const p = estado.pantalla, id = estado.params.id;
    const html = {
      inicio: pInicio, documentos: pDocumentos, clientes: pClientes, cobranza: pCobranza, dictado: pDictado,
      analisis: pAnalisis, escribir: pEscribir,
      documento: () => pDocumento(id), pdf: () => pPDF(id), cliente: () => pCliente(id), recordatorio: () => pRecordatorio(id),
    }[p]();
    const scroll = vista.scrollTop;
    vista.innerHTML = html;
    vista.scrollTop = arriba ? 0 : scroll;
    const conTabs = !SIN_TABS.includes(p);
    tabs.hidden = !conTabs;
    vista.classList.toggle('sin-tabs', !conTabs);
    vista.classList.remove('compacta');
    if (conTabs) {
      const raiz = RAIZ[p];
      tabs.innerHTML = TABS.map(([t, nombre]) =>
        '<button class="tab' + (raiz === t ? ' on' : '') + '" data-tab="' + t + '"' + (raiz === t ? ' aria-current="page"' : '') + '>' + ICONO[t] + nombre + '</button>').join('');
    }
    toast.style.bottom = conTabs ? '' : '14px';
  }

  // Inicio: al bajar por el historial, el bloque oscuro se vuelve una franja
  vista.addEventListener('scroll', () => {
    if (estado.pantalla === 'inicio') vista.classList.toggle('compacta', vista.scrollTop > 200);
  }, { passive: true });

  function redibujarLista(contenedorId, input, pantalla) {
    const pos = input.selectionStart;
    const tmp = document.createElement('div');
    tmp.innerHTML = pantalla();
    document.getElementById(contenedorId).innerHTML = tmp.querySelector('#' + contenedorId).innerHTML;
    input.setSelectionRange(pos, pos);
  }
  vista.addEventListener('input', e => {
    if (e.target.id === 'buscar-docs') { estado.busqueda = e.target.value; redibujarLista('lista-docs', e.target, pDocumentos); }
    if (e.target.id === 'buscar-cli') { estado.busquedaCli = e.target.value; redibujarLista('lista-cli', e.target, pClientes); }
    if (e.target.id === 'msg-recordatorio') estado.borrador = e.target.value;
    if (e.target.id === 'texto-venta') estado.texto = e.target.value;
  });

  tabs.addEventListener('click', e => {
    const b = e.target.closest('[data-tab]');
    if (b) irTab(b.dataset.tab);
  });

  vista.addEventListener('click', e => {
    const zona = e.target.closest('[data-mes]');
    if (zona) { estado.mesSel = Number(zona.dataset.mes); return dibujar(); }
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.ir) return ir(b.dataset.ir, b.dataset.id ? { id: b.dataset.id } : {});
    if (b.dataset.filtro) { estado.filtro = b.dataset.filtro; return dibujar(); }
    const dd = estado.dictado;
    const doc = b.dataset.id && estado.datos.documentos.find(d => d.id === b.dataset.id);
    switch (b.dataset.accion) {
      case 'atras': return atras();
      case 'dictar': return empezarDictado(b.dataset.cliente);
      case 'listo-dictado':
        clearInterval(temporizadorDictado);
        dd.palabras = dd.texto.split(' ').length;
        dd.paso = 2; return dibujar(true);
      case 'cancelar-dictado': clearInterval(temporizadorDictado); estado.dictado = null; return atras();
      case 'redictar': clearInterval(temporizadorDictado); return empezarDictado(dd.desdeCotizacion ? null : undefined);
      case 'iva': dd.ivaIncluido = b.dataset.v === 'si'; return dibujar();
      case 'cambiar-pago': dd.pago = dd.pago === 'Contado' ? '30 días' : 'Contado'; return dibujar();
      case 'observacion': dd.observacion = 'Orden de compra 4512'; aviso('Observación agregada. <b>En la versión real</b> la escribes o la dictas.'); return dibujar();
      case 'cambiar-cliente': return enLaReal('eliges otro cliente de tu lista o lo buscas por RUT.');
      case 'editar-detalle': return enLaReal('cambias cantidades, precios o agregas líneas.');
      case 'emitir': return emitir();
      case 'fin-dictado': estado.dictado = null; estado.texto = ''; return irTab('inicio');
      case 'escribir': return ir('escribir');
      case 'ejemplo-texto': estado.texto = EJEMPLOS[Number(b.dataset.i)]; return dibujar();
      case 'leer-texto': {
        const texto = (estado.texto || '').trim();
        if (!texto) return aviso('Escribe tu venta o toca uno de los ejemplos.');
        const r = L.leerTexto(texto, estado.datos.clientes);
        if (!r.cliente) return aviso('No encontré el cliente. Escribe el nombre de uno de tus clientes, por ejemplo Los Robles.');
        if (!r.items.length) return aviso('Falta el monto. Agrega cuánto fue, por ejemplo «3 fletes a 40.000».');
        estado.dictado = Object.assign({ paso: 2, texto, palabras: 0, observacion: '', escrito: true }, r);
        return ir('dictado');
      }
      case 'compartir': {
        const actual = doc || estado.datos.documentos.find(d => d.id === (estado.params.id || (dd && dd.emitida)));
        const texto = actual ? titulo(actual) + ' de ' + estado.datos.empresa.nombre + ' a ' + actual.cliente.nombre + ' por ' + $(actual.total) + '.' : 'Documento de InVoice';
        return compartir(texto, 'se abre tu WhatsApp con el PDF listo para mandarlo a quien quieras.');
      }
      case 'descargar': return enLaReal('el PDF se guarda en tu celular.');
      case 'correo': return enLaReal('se envía el PDF al correo del cliente.');
      case 'nc': return enLaReal('dictas el motivo y se emite la nota de crédito que anula o corrige esta factura.');
      case 'nuevo-cliente': return enLaReal('dictas o escribes el RUT y InVoice trae sus datos.');
      case 'pagada': doc.pagada = true; aviso(titulo(doc) + ' marcada como <b>pagada</b>.'); return dibujar();
      case 'impaga': doc.pagada = false; aviso(titulo(doc) + ' vuelve a <b>por cobrar</b>.'); return dibujar();
      case 'enviar-recordatorio': {
        const msg = document.getElementById('msg-recordatorio');
        return compartir(msg ? msg.value : '', 'se abre tu WhatsApp con este mensaje y el PDF, para mandarlo desde tu número.');
      }
      case 'convertir':
        estado.dictado = { paso: 2, cliente: doc.cliente, items: doc.items.map(i => Object.assign({}, i)), ivaIncluido: false, pago: doc.cliente.pago, observacion: 'Según ' + titulo(doc), desdeCotizacion: doc.id, texto: '', palabras: 0 };
        return ir('dictado');
    }
  });
  dibujar(true);
})();
</script>

</body>
</html>
